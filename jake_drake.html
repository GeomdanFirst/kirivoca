<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jake Drake 원서 어휘퀴즈 · 키즈엔리딩 검단퍼스트점</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Noto Sans KR', 'Inter', sans-serif;
      background-color: #FAF8F5;
      color: #1F2937;
    }
    .book-card {
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .book-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 28px -12px rgba(30, 58, 95, 0.14);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 상단 헤더 -->
  <header class="w-full bg-white/90 backdrop-blur border-b border-stone-200/80 sticky top-0 z-20">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <span class="w-9 h-9 rounded-xl bg-[#1E3A5F] text-white flex items-center justify-center font-extrabold text-sm shadow-sm">KR</span>
        <div>
          <p class="text-xs font-semibold text-amber-600 leading-tight">키즈엔리딩 검단퍼스트점</p>
          <p class="text-sm sm:text-base font-extrabold text-slate-800 leading-tight">Jake Drake 원서 어휘퀴즈</p>
        </div>
      </div>
      <span id="todayBadge" class="hidden sm:inline-block text-xs font-medium text-slate-500 bg-stone-100 px-3 py-1.5 rounded-full"></span>
    </div>
  </header>

  <!-- 메인 콘텐츠 -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-8 sm:py-10 space-y-6">

    <!-- 상단 타이틀 & 검색/필터 -->
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
      <div class="space-y-1">
        <span class="inline-block text-xs font-bold tracking-wider uppercase text-[#1E3A5F] bg-blue-50 border border-blue-100 px-2.5 py-0.5 rounded-full">
          Andrew Clements · 4 Books
        </span>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">Jake Drake 시리즈 어휘 퀴즈</h1>
        <p class="text-sm text-slate-600">읽은 책의 퀴즈 버튼을 눌러 NotebookLM에서 바로 풀어보세요.</p>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <input id="searchInput" type="search" placeholder="책 제목 검색..."
          class="w-full sm:w-52 px-3.5 py-2 text-sm bg-white border border-stone-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1E3A5F]/30" />
        <button id="favFilterBtn" type="button"
          class="px-3.5 py-2 text-xs sm:text-sm font-bold rounded-xl border border-stone-300 bg-white text-slate-700 hover:bg-stone-50 transition">
          ★ 즐겨찾기만
        </button>
      </div>
    </div>

    <!-- 4권 카드 그리드 -->
    <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>

    <!-- 빈 검색 결과 -->
    <div id="emptyState" class="hidden text-center py-12 bg-white rounded-3xl border border-stone-200 text-slate-500 text-sm">
      조건에 맞는 책이 없어요. 검색어나 즐겨찾기 필터를 해제해 보세요.
    </div>

  </main>

  <!-- 토스트 알림 -->
  <div id="toast"
    class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs sm:text-sm font-semibold px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-200 z-30">
  </div>

  <script>
    /**
     * =========================================================================
     * [원장님 설정 영역] 책 제목과 각 2개의 퀴즈 링크를 관리합니다.
     * =========================================================================
     */
    const BOOKS = [
      {
        id: "book-1",
        num: "BOOK 01",
        author: "Andrew Clements",
        title: "Jake Drake, Teacher's Pet",
        badgeClass: "bg-blue-50 text-[#1E3A5F] border-blue-100",
        quizzes: [
          { label: "어휘 퀴즈 1", url: "https://notebooklm.link.google/7Q3pTo9SGWq6" },
          { label: "어휘 퀴즈 2", url: "https://notebooklm.link.google/tEOHMwsMuO98" }
        ]
      },
      {
        id: "book-2",
        num: "BOOK 02",
        author: "Andrew Clements",
        title: "Jake Drake, Bully Buster",
        badgeClass: "bg-amber-50 text-amber-800 border-amber-200",
        quizzes: [
          { label: "어휘 퀴즈 1", url: "https://notebooklm.link.google/0aSQ58tQB3Gj" },
          { label: "어휘 퀴즈 2", url: "https://notebooklm.link.google/D5rgyPdVjJp3" }
        ]
      },
      {
        id: "book-3",
        num: "BOOK 03",
        author: "Andrew Clements",
        title: "Jake Drake, Know-It-All",
        badgeClass: "bg-emerald-50 text-emerald-800 border-emerald-200",
        quizzes: [
          { label: "어휘 퀴즈 1", url: "https://notebooklm.link.google/YOhgSC10cgv7" },
          { label: "어휘 퀴즈 2", url: "https://notebooklm.link.google/z3kAzE7oDLr4" }
        ]
      },
      {
        id: "book-4",
        num: "BOOK 04",
        author: "Andrew Clements",
        title: "Jake Drake, Class Clown",
        note: "링크 확인 필요",
        badgeClass: "bg-orange-50 text-orange-800 border-orange-200",
        quizzes: [
          { label: "어휘 퀴즈 1", url: "https://notebooklm.link.google/GKpGFsxTUTrO" },
          { label: "어휘 퀴즈 2", url: "https://notebooklm.link.google/mPzZkG5XFEYh" }
        ]
      }
    ];

    function formatEnglishToday(dateObj) {
      const weekdays = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      const ordinals = [
        "", "first", "second", "third", "fourth", "fifth", "sixth", "seventh", "eighth", "ninth", "tenth",
        "eleventh", "twelfth", "thirteenth", "fourteenth", "fifteenth", "sixteenth", "seventeenth", "eighteenth", "nineteenth", "twentieth",
        "twenty-first", "twenty-second", "twenty-third", "twenty-fourth", "twenty-fifth", "twenty-sixth", "twenty-seventh", "twenty-eighth", "twenty-ninth", "thirtieth", "thirty-first"
      ];
      return `Today is ${weekdays[dateObj.getDay()]}, the ${ordinals[dateObj.getDate()]} of ${months[dateObj.getMonth()]}.`;
    }

    function loadFavorites() {
      try {
        const raw = localStorage.getItem("kr_jake_drake_favs");
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveFavorites(list) {
      try {
        localStorage.setItem("kr_jake_drake_favs", JSON.stringify(list));
      } catch (e) {
        // ignore storage restrictions
      }
    }

    let favorites = loadFavorites();
    let onlyFavorites = false;
    let searchQuery = "";
    let toastTimer = null;

    const cardsGrid = document.getElementById("cardsGrid");
    const emptyState = document.getElementById("emptyState");
    const searchInput = document.getElementById("searchInput");
    const favFilterBtn = document.getElementById("favFilterBtn");
    const toast = document.getElementById("toast");

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.remove("opacity-0");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.add("opacity-0"), 1800);
    }

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast("링크를 복사했어요!")).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        showToast("링크를 복사했어요!");
      } catch (e) {
        showToast("복사에 실패했어요.");
      }
      document.body.removeChild(ta);
    }

    function renderCards() {
      const q = searchQuery.trim().toLowerCase();
      const filtered = BOOKS.filter((book) => {
        if (onlyFavorites && !favorites.includes(book.id)) return false;
        if (!q) return true;
        return (
          book.title.toLowerCase().includes(q) ||
          book.author.toLowerCase().includes(q) ||
          book.quizzes.some((qz) => qz.url.toLowerCase().includes(q))
        );
      });

      cardsGrid.innerHTML = "";
      emptyState.classList.toggle("hidden", filtered.length > 0);

      filtered.forEach((book) => {
        const isFav = favorites.includes(book.id);
        const card = document.createElement("div");
        card.className = "book-card bg-white rounded-3xl p-6 border border-stone-200/90 hover:border-[#1E3A5F]/40 shadow-sm flex flex-col justify-between gap-5";

        const quizRowsHtml = book.quizzes.map((qz) => `
          <div class="flex items-center justify-between gap-2 bg-stone-50/90 border border-stone-200/70 rounded-2xl p-3">
            <div class="min-w-0">
              <p class="text-sm font-bold text-slate-800">${qz.label}</p>
              <p class="text-[11px] font-mono text-slate-400 truncate">${qz.url.replace("https://", "")}</p>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <a href="${qz.url}" target="_blank" rel="noopener noreferrer"
                class="px-3.5 py-2 rounded-xl bg-[#1E3A5F] hover:bg-[#162d4a] text-white text-xs font-bold transition">
                퀴즈 열기 ↗
              </a>
              <button type="button" data-copy="${qz.url}"
                class="px-2.5 py-2 rounded-xl border border-stone-200 bg-white hover:bg-stone-100 text-slate-600 text-xs font-bold transition">
                복사
              </button>
            </div>
          </div>
        `).join("");

        const noteBadge = book.note
          ? `<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-rose-50 text-rose-600 border border-rose-200">${book.note}</span>`
          : "";

        card.innerHTML = `
          <div class="space-y-3">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-xs font-extrabold px-2.5 py-1 rounded-lg border ${book.badgeClass}">${book.num}</span>
                <span class="text-xs font-semibold text-slate-400">${book.author}</span>
                ${noteBadge}
              </div>
              <button type="button" data-fav="${book.id}" aria-label="즐겨찾기"
                class="text-xl leading-none px-1.5 py-0.5 rounded-lg hover:bg-stone-100 transition ${isFav ? "text-amber-500" : "text-stone-300"}">
                ${isFav ? "★" : "☆"}
              </button>
            </div>
            <h2 class="text-xl font-extrabold text-slate-900 leading-snug">${book.title}</h2>
          </div>

          <div class="space-y-2.5">
            ${quizRowsHtml}
          </div>
        `;
        cardsGrid.appendChild(card);
      });
    }

    cardsGrid.addEventListener("click", (e) => {
      const favBtn = e.target.closest("[data-fav]");
      if (favBtn) {
        const id = favBtn.getAttribute("data-fav");
        if (favorites.includes(id)) {
          favorites = favorites.filter((f) => f !== id);
        } else {
          favorites.push(id);
        }
        saveFavorites(favorites);
        renderCards();
        return;
      }

      const copyBtn = e.target.closest("[data-copy]");
      if (copyBtn) {
        copyText(copyBtn.getAttribute("data-copy"));
      }
    });

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderCards();
    });

    favFilterBtn.addEventListener("click", () => {
      onlyFavorites = !onlyFavorites;
      favFilterBtn.className = onlyFavorites
        ? "px-3.5 py-2 text-xs sm:text-sm font-bold rounded-xl border border-amber-300 bg-amber-50 text-amber-800 transition"
        : "px-3.5 py-2 text-xs sm:text-sm font-bold rounded-xl border border-stone-300 bg-white text-slate-700 hover:bg-stone-50 transition";
      renderCards();
    });

    document.getElementById("todayBadge").textContent = formatEnglishToday(new Date());
    renderCards();
  </script>
</body>
</html>
