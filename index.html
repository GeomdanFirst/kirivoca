<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>키즈엔리딩 검단퍼스트점 · 오늘의 영어 루틴</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Noto Sans KR', 'Inter', sans-serif;
      background-color: #FAF8F5;
      color: #1F2937;
    }
    .card-hover {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 32px -12px rgba(30, 58, 95, 0.14);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="w-full bg-white/90 backdrop-blur border-b border-stone-200/80 sticky top-0 z-20">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span class="w-9 h-9 rounded-xl bg-[#1E3A5F] text-white flex items-center justify-center font-extrabold text-sm shadow-sm">KR</span>
        <div>
          <p class="text-xs font-semibold text-amber-600 leading-tight">키즈엔리딩 검단퍼스트점</p>
          <p class="text-sm sm:text-base font-extrabold text-slate-800 leading-tight">오늘의 리딩룸 루틴</p>
        </div>
      </div>
      <span id="todayBadge" class="text-xs sm:text-sm font-medium text-slate-500 bg-stone-100 px-3 py-1.5 rounded-full"></span>
    </div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-8 sm:py-12">
    <section class="space-y-8">
      <div class="text-center space-y-2">
        <span class="inline-block text-xs font-bold tracking-wider uppercase text-[#1E3A5F] bg-blue-50 border border-blue-100 px-3 py-1 rounded-full">
          Daily Routine
        </span>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">
          오늘 할 루틴을 선택하세요
        </h1>
        <p class="text-sm sm:text-base text-slate-600">
          리딩룸에 오면 순서대로 차근차근 스스로 시작해 볼까요?
        </p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- 기존 키리보카 페이지(voca.html)로 이동 -->
        <a href="voca.html"
          class="card-hover text-left bg-white rounded-3xl p-7 border-2 border-orange-100 hover:border-orange-300 shadow-sm flex flex-col justify-between min-h-[240px]">
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <span class="w-14 h-14 rounded-2xl bg-orange-50 text-3xl flex items-center justify-center">🗂️</span>
              <span class="text-xs font-bold text-orange-600 bg-orange-50 px-3 py-1 rounded-full">KR2 어휘 훈련</span>
            </div>
            <div>
              <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900">키리보카 플래시카드</h2>
              <p class="mt-1.5 text-sm text-slate-600 leading-relaxed">
                오늘 외울 핵심 영단어와 예문을 플래시카드로 빠르게 익혀요.
              </p>
            </div>
          </div>
          <div class="mt-6 flex items-center justify-between text-orange-600 font-bold text-sm">
            <span>플래시카드 시작하기</span>
            <span class="text-lg">→</span>
          </div>
        </a>

        <!-- R.I.S.E. 따라 읽기 페이지(rise.html)로 이동 -->
        <a href="rise.html"
          class="card-hover text-left bg-white rounded-3xl p-7 border-2 border-blue-100 hover:border-[#1E3A5F]/40 shadow-sm flex flex-col justify-between min-h-[240px]">
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <span class="w-14 h-14 rounded-2xl bg-blue-50 text-3xl flex items-center justify-center">🎙️</span>
              <span class="text-xs font-bold text-[#1E3A5F] bg-blue-50 px-3 py-1 rounded-full">MORNING R.I.S.E.</span>
            </div>
            <div>
              <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900">R.I.S.E. 따라 읽기</h2>
              <p class="mt-1.5 text-sm text-slate-600 leading-relaxed">
                이번 달 주간 구문 영상을 보며 원어민 리듬 그대로 소리 내어 따라 읽어요.
              </p>
            </div>
          </div>
          <div class="mt-6 flex items-center justify-between text-[#1E3A5F] font-bold text-sm">
            <span>이번 달 영상 바로 보기</span>
            <span class="text-lg">→</span>
          </div>
        </a>
      </div>
    </section>
  </main>

  <script>
    const now = new Date();
    document.getElementById("todayBadge").textContent = `${now.getMonth() + 1}월 ${now.getDate()}일`;
  </script>
</body>
</html>
